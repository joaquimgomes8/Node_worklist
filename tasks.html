<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tarefas | Work Lista</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="wordmark" href="tasks.html" aria-label="Work Lista, ir para as tarefas"><svg class="logo" viewBox="0 0 32 32" width="28" height="28"><rect class="logo-bg" width="32" height="32" rx="9"/><path class="logo-check" d="M9 16.5l4.5 4.5L23 11"/></svg><span class="wordmark-text">Work Lista</span></a>
    <nav class="tabs" aria-label="Principal"><a class="tab" href="tasks.html" aria-current="page">Tarefas</a><a class="tab" href="trash.html">Lixeira <span id="trash-count" class="count" hidden>0</span></a></nav>
    <div class="user"><span id="user-email" class="user-email"></span><button id="logout-btn" class="btn btn-quiet btn-sm" type="button"><span data-icon="logout"></span><span class="btn-label">Sair</span></button></div>
  </div></header>
  <main class="page"><div class="page-head"><div><h1>Tarefas</h1><p id="summary" class="page-sub" aria-live="polite"></p></div><button id="open-task-modal" class="btn btn-primary" type="button">+ Adicionar tarefa</button></div>
    <div class="sheet"><div id="category-toolbar" class="toolbar category-toolbar" role="group" aria-label="Categorias de tarefas"><button class="chip" type="button" data-category="Geral" aria-pressed="true">Geral</button><button class="chip" type="button" data-category="Pessoal" aria-pressed="false">Pessoal</button><button class="chip" type="button" data-category="Trabalho" aria-pressed="false">Trabalho</button><button class="chip" type="button" data-category="Estudos" aria-pressed="false">Estudos</button><button id="add-category" class="category-add" type="button" aria-label="Adicionar categoria" title="Adicionar categoria">+</button></div>
      <div class="toolbar" role="group" aria-label="Filtrar tarefas"><button class="chip" type="button" data-filter="all" aria-pressed="true">Todas</button><button class="chip" type="button" data-filter="pending" aria-pressed="false">Pendentes</button><button class="chip" type="button" data-filter="done" aria-pressed="false">Concluídas</button></div><ul id="task-list" class="rows"></ul><div id="status" class="empty" hidden><h2 id="status-title"></h2><p id="status-text"></p></div>
    </div></main>
  <div id="task-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="task-modal-title"><div class="modal-card"><div class="modal-head"><h2 id="task-modal-title">Adicionar tarefa</h2><button id="close-task-modal" class="icon-btn" type="button" aria-label="Fechar janela">×</button></div><form id="task-form" class="composer"><label for="task-title">Título da tarefa</label><input id="task-title" class="input" name="title" type="text" maxlength="120" placeholder="O que precisa ser feito?" required><label for="task-desc">Descrição</label><textarea id="task-desc" class="input" name="description" rows="3" maxlength="1000" placeholder="Detalhes (opcional)"></textarea><div class="form-grid"><div><label for="task-category">Categoria</label><select id="task-category" class="input" name="category"><option value="Geral">Geral</option><option value="Pessoal">Pessoal</option><option value="Trabalho">Trabalho</option><option value="Estudos">Estudos</option></select></div><div><label for="task-due-date">Data limite</label><input id="task-due-date" class="input" name="dueDate" type="date"></div><div><label for="task-priority">Prioridade</label><select id="task-priority" class="input" name="priority"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select></div></div><label for="task-link">Link (opcional)</label><input id="task-link" class="input" name="link" type="url" placeholder="https://exemplo.com"><div class="subtasks-editor"><label for="subtask-input">Subtarefas</label><div class="subtask-add"><input id="subtask-input" class="input" type="text" maxlength="120" placeholder="Adicionar subtarefa"><button id="add-subtask" class="btn btn-quiet" type="button">Adicionar</button></div><ul id="subtask-editor-list" class="subtask-editor-list"></ul></div><div class="attachment-field"><label for="task-image">Imagem (opcional)</label><input id="task-image" name="image" type="file" accept="image/*"><p class="field-help">Você também pode colar uma imagem com Ctrl+V neste campo.</p><div id="image-preview" class="image-preview" hidden><img alt="Prévia da imagem anexada"><button id="remove-image" class="btn btn-quiet btn-sm" type="button">Remover imagem</button></div></div><div class="composer-actions"><button id="cancel-task-modal" class="btn btn-quiet" type="button">Cancelar</button><button id="task-submit" class="btn btn-primary" type="submit">Cadastrar tarefa</button></div></form></div></div>
  <div id="category-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="category-modal-title"><div class="modal-card modal-small"><div class="modal-head"><h2 id="category-modal-title">Nova categoria</h2><button id="close-category-modal" class="icon-btn" type="button" aria-label="Fechar janela">×</button></div><form id="category-form" class="composer"><label for="category-name">Nome da categoria</label><input id="category-name" class="input" name="name" type="text" maxlength="30" placeholder="Ex.: Projetos" required><p id="category-error" class="form-error" hidden></p><div class="composer-actions"><button id="cancel-category" class="btn btn-quiet" type="button">Cancelar</button><button class="btn btn-primary" type="submit">Criar categoria</button></div></form></div></div>
  <script src="js/script.js"></script>
</body>
</html>
