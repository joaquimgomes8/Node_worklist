# PostgreSQL local para desenvolvimento (opcional).
# Subir:   docker compose up -d
# Parar:   docker compose down        (os dados ficam no volume "worklista-data")
services:
  db:
    image: postgres:16-alpine
    container_name: worklista-db
    environment:
      POSTGRES_DB: worklista
      POSTGRES_USER: worklista
      POSTGRES_PASSWORD: worklista
    ports:
      - "5432:5432"
    volumes:
      - worklista-data:/var/lib/postgresql/data

volumes:
  worklista-data:
