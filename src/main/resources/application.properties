# ============================================================================
# Work Lista - configuração padrão
# Tudo que aparece como ${VARIAVEL:padrao} pode ser sobrescrito por variável
# de ambiente, sem precisar editar este arquivo.
# ============================================================================

spring.application.name=work-lista
server.port=${PORT:8080}

# ---------------------------------------------------------------- Banco de dados
# Padrão: H2 em arquivo (./data/worklista.mv.db). Não precisa instalar nada e
# os dados sobrevivem a reinicializações. Para PostgreSQL use o perfil "postgres".
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/worklista}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# "update" cria/ajusta as tabelas automaticamente. Em produção, prefira
# migrations (Flyway/Liquibase) e troque para "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Evita consultas "escondidas" durante a serialização da resposta.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- JWT
# O segredo assina os tokens. Precisa ter no mínimo 32 caracteres.
# EM PRODUÇÃO: defina a variável de ambiente JWT_SECRET (ex.: openssl rand -base64 48).
app.jwt.secret=${JWT_SECRET:troque-esta-chave-secreta-em-producao-0123456789}
# Tempo de vida do token, em minutos (padrão: 2 horas).
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ---------------------------------------------------------------- CORS
# Só é necessário se o front-end for servido de OUTRO endereço (ex.: Live Server).
# Quando o front é servido pelo próprio Spring Boot (padrão), não há CORS.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
