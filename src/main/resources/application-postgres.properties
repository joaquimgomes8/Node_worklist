# Perfil "postgres": mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Sobrescreve apenas o que muda em relação ao application.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/worklista}
spring.datasource.username=${DB_USER:worklista}
spring.datasource.password=${DB_PASSWORD:worklista}
spring.datasource.driver-class-name=org.postgresql.Driver
